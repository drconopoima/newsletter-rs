# ========== MEMORY SETTINGS (2GB SAFE) ==========
# For 2GB RAM: These are MAX SAFE values
# For 4GB+ RAM: Uncomment [HIGH-MEM] lines below
shared_buffers = 512MB           # 25% of 2GB. [HIGH-MEM: 4GB]
work_mem = 32MB                  # Per operation. [HIGH-MEM: 64MB]
maintenance_work_mem = 128MB     # For VACUUM/indexing. [HIGH-MEM: 1GB]
wal_buffers = 32MB               # Auto (≈16MB). [HIGH-MEM: 64MB]

# ========== WAL SETTINGS ==========
synchronous_commit = off
min_wal_size = 128MB             # [HIGH-MEM: 256MB]
max_wal_size = 256MB             # [HIGH-MEM: 2GB]
wal_init_zero = off
wal_compression = on             # Reduces I/O (PG13+)

# ========== PARALLELISM ==========
# For 2GB RAM / 4-core RPi: Safe defaults
# For 22-core 16GB: Use [HIGH-MEM] values
max_worker_processes = 6         # [HIGH-MEM: 12]
max_parallel_workers = 3         # [HIGH-MEM: 6]
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 1

# ========== CONNECTIONS ==========
max_connections = 120          # [HIGH-MEM: 400]
                               # Note: Each connection uses ~10MB baseline

# ========== I/O SETTINGS (NVMe Optimized) ==========
random_page_cost = 1.1           # Good for NVMe (default=4.0)
effective_io_concurrency = 100   # For NVMe/SSD
maintenance_io_concurrency = 10

# ========== CHECKPOINT SETTINGS ==========
checkpoint_timeout = 10min       # Longer = less I/O spikes
checkpoint_completion_target = 0.9

# ========== TIMEOUTS ==========
lock_timeout = 4s
statement_timeout = 30s
deadlock_timeout = 1s
idle_in_transaction_session_timeout = 240000

# ========== OTHER ==========
listen_addresses = '*'
log_lock_waits = off
autovacuum = on
autovacuum_max_workers = 3       # [HIGH-MEM: 6]
autovacuum_naptime = 10s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_vacuum_cost_limit = 4000
